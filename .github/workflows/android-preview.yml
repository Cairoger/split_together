name: Android preview

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-preview:
    name: Test and build preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter SDK
        env:
          FLUTTER_VERSION: '3.50.0'
          FLUTTER_SHA256: 6ea2d806fd57269ae783e6788e2a81fc26eaad782f1e0d0ff38623bb765ff9f5
        run: |
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl --fail --show-error --silent --location --retry 3 \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz" \
            --output "$archive"
          echo "$FLUTTER_SHA256  $archive" | sha256sum --check
          tar --extract --file="$archive" --directory="$RUNNER_TEMP"
          rm "$archive"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Analyze and test
        run: |
          flutter --version
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
          flutter test --no-pub

      - name: Prepare Android SDK
        env:
          ANDROID_CMDLINE_SHA256: 04453066b540409d975c676d781da1477479dde3761310f1a7eb92a1dfb15af7
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          sdk_ready() {
            [[ -x "$sdk_root/platform-tools/adb" &&
               -f "$sdk_root/platforms/android-36/android.jar" &&
               -x "$sdk_root/build-tools/36.0.0/aapt2" &&
               -f "$sdk_root/ndk/28.2.13676358/source.properties" ]]
          }

          if ! sdk_ready; then
            if [[ ! -s "$sdk_root/licenses/android-sdk-license" ]]; then
              echo "::error::The runner does not have a licensed Android SDK at $sdk_root."
              exit 1
            fi

            sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
            if [[ ! -x "$sdkmanager" ]]; then
              # Google Android SDK Command-line Tools 20.0 (compatible with JDK 17).
              tools_dir="$(mktemp -d "$RUNNER_TEMP/android-tools.XXXXXX")"
              archive="$tools_dir/commandline-tools.zip"
              curl --fail --show-error --silent --location --retry 3 \
                "https://dl.google.com/android/repository/commandlinetools-linux-14742923_latest.zip" \
                --output "$archive"
              echo "$ANDROID_CMDLINE_SHA256  $archive" | sha256sum --check
              unzip -q "$archive" -d "$tools_dir"
              sdkmanager="$tools_dir/cmdline-tools/bin/sdkmanager"
            fi

            "$sdkmanager" --sdk_root="$sdk_root" \
              "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;28.2.13676358" </dev/null
          fi

          if ! sdk_ready; then
            echo "::error::Android SDK packages are incomplete at $sdk_root."
            exit 1
          fi

          printf '%s\n' "ANDROID_HOME=$sdk_root" "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"

      - name: Build preview APK
        env:
          ORG_GRADLE_PROJECT_splitTogetherPreview: 'true'
        run: flutter build apk --debug --no-pub

      - name: Verify package and label
        run: |
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          inspection="$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$apk")"
          grep -q "^package: name='com\.example\.split_together\.preview' " <<< "$inspection"
          grep -Fxq "application-label:'SplitTogether Preview'" <<< "$inspection"
          mkdir -p artifacts
          cp "$apk" "artifacts/SplitTogether-Preview-${GITHUB_SHA::12}.apk"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: SplitTogether-Android-Preview-${{ github.sha }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
